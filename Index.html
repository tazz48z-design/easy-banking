<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#121212" />
<title>Easy Banking</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --green:#00a651;--green-b:#1db954;--green-d:#008a42;
  --bg:#121212;--card:#1e1e1e;--elev:#2a2a2a;--border:#2a2a2a;
  --t1:#fff;--t2:#a0a0a0;--t3:#6b6b6b;--t4:#8a8a8a;
  --blue:#3b82f6;--teal:#2dd4bf;--lime:#b8e03a;--star:#e8a87c;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;width:100%;overflow:hidden;background:#000;color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit;border:none;outline:none;background:none;color:inherit}
.app-shell{height:100%;width:100%;display:flex;align-items:center;justify-content:center;background:#0a0a0a}
.phone{position:relative;width:100%;height:100%;max-width:430px;max-height:932px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:500px){.phone{border-radius:40px;box-shadow:0 0 0 10px #1a1a1a,0 0 0 12px #333,0 25px 80px rgba(0,0,0,.8);max-height:min(932px,96vh)}}
.screen{flex:1;display:none;flex-direction:column;overflow:hidden;height:100%;position:relative}
.screen.active{display:flex}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.sb{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 4px;font-size:14px;font-weight:600;flex-shrink:0;z-index:20}
.sb.dark{color:#fff}.sb.light{color:#000}
.sb-ic{display:flex;align-items:center;gap:6px}
.sb-ic svg{width:16px;height:16px}
.bnav{display:flex;background:#1a1a1a;border-top:1px solid #2a2a2a;padding:8px 0 calc(8px + var(--safe-b));flex-shrink:0;z-index:30}
.nt{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;color:#6b6b6b;font-size:10px;font-weight:500}
.nt.on{color:var(--green-b)}
.nt svg{width:24px;height:24px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scanMove{0%,100%{top:24px}50%{top:calc(100% - 26px)}}
.fi{animation:fadeIn .35s ease-out both}
.su{animation:slideUp .4s cubic-bezier(.22,1,.36,1) both}
.shake{animation:shake .4s ease-in-out}
.back{display:flex;align-items:center;gap:4px;color:var(--green-b);font-size:16px;min-width:70px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 12px}
.hdr h1{font-size:17px;font-weight:600}
.btn-g{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--green);color:#fff;font-size:17px;font-weight:600;padding:16px;border-radius:50px;transition:background .2s,transform .15s}
.btn-g:active{background:var(--green-d);transform:scale(.98)}
.btn-g:disabled,.btn-g.dis{background:#2a2a2a;color:#5a5a5a;cursor:not-allowed;transform:none}
.card{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden}
.div{height:1px;background:var(--border)}
</style>
</head>

<div class="app-shell"><div class="phone" id="app"></div></div>

function money(n){return n.toLocaleString('fr-BE',{minimumFractionDigits:2,maximumFractionDigits:2})+' \u20AC'}
function moneyShort(n){return n.toLocaleString('fr-BE',{minimumFractionDigits:2})+' \u20AC'}
function timeNow(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function dateFr(s){return new Date(s).toLocaleDateString('fr-BE',{day:'numeric',month:'short'})}
function dateLong(s){return new Date(s).toLocaleDateString('fr-BE',{day:'numeric',month:'long',year:'numeric'})}

/* ========== NAV ========== */
function go(name, opts){
  if(opts && opts.resetDraft){state.draft=null;state.amountStr='';state.comm='';state.done=false;state.sending=false}
  state.screen = name;
  render();
  // scroll tops
  requestAnimationFrame(()=>{
    document.querySelectorAll('.scroll').forEach(el=>el.scrollTop=0);
  });
}

/* ========== UI PIECES ========== */
function statusBar(variant){
  const c = variant==='light'?'#000':'#fff';
  return `<div class="sb ${variant}">
    <span>${timeNow()}</span>
    <div class="sb-ic">
      <svg viewBox="0 0 18 12" fill="${c}"><rect x="0" y="8" width="3" height="4" rx=".5"/><rect x="5" y="5" width="3" height="7" rx=".5"/><rect x="10" y="2" width="3" height="10" rx=".5"/><rect x="15" y="0" width="3" height="12" rx=".5" opacity=".35"/></svg>
      <svg viewBox="0 0 16 12" fill="${c}"><path d="M8 9.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM8 6c1.6 0 3.05.65 4.1 1.7l-1.2 1.2A4.1 4.1 0 008 7.7c-1.1 0-2.1.43-2.85 1.15L4 7.7A5.7 5.7 0 018 6zm0-3.5c2.5 0 4.75 1 6.4 2.65L13.2 6.3A7.4 7.4 0 008 4.2a7.4 7.4 0 00-5.2 2.1L1.6 5.15A9.1 9.1 0 018 2.5z"/></svg>
      <svg viewBox="0 0 25 12" fill="${c}"><rect x="0" y="1" width="21" height="10" rx="2" stroke="${c}" stroke-width="1.2" fill="none" opacity=".4"/><rect x="1.5" y="2.5" width="15" height="7" rx="1"/><path d="M22 4v4a1.5 1.5 0 000-4z" opacity=".5"/></svg>
    </div>
  </div>`;
}

  const tabs=[

    {id:'contact',label:'Contact',svg:(on)=>`<svg viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>`},
    {id:'settings',label:'Paramètres',svg:(on)=>`<svg viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M4 20c0-3.5 3.5-6 8-6s8 2.5 8 6" stroke-linecap="round"/></svg>`},
  ];
  return `<nav class="bnav">${tabs.map(t=>`<button class="nt ${t.id===active?'on':''}" data-go="${t.id}"><span style="height:26px;display:flex;align-items:center">${t.svg(t.id===active)}</span><span>${t.label}</span></button>`).join('')}</nav>`;
}

function chev(){return `<svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1 1l6 6-6 6" stroke="#6b6b6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}

function screenPin(){
  const dots = Array.from({length:5},(_,i)=>`<div style="width:14px;height:4px;border-radius:2px;background:${state.pinErr?'#ff3b30':(i<state.pin.length?'#1a1a1a':'#c7c7cc')};transform:${i<state.pin.length?'scaleY(1.4)':'none'};transition:background .15s,transform .15s"></div>`).join('');
  const keys=['1','2','3','4','5','6','7','8','9','','0','del'];
  const pad = keys.map(k=>{
    if(k==='') return `<div></div>`;
    if(k==='del') return `<button data-pin="del" style="height:64px;display:flex;align-items:center;justify-content:center;border-radius:50%">
      <svg width="28" height="20" viewBox="0 0 28 20" fill="none"><path d="M10 2H24a2 2 0 012 2v12a2 2 0 01-2 2H10L2 10l8-8z" stroke="#1a1a1a" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 7l6 6M19 7l-6 6" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>`;
    return `<button data-pin="${k}" style="height:64px;font-size:32px;font-weight:400;color:#00a651;border-radius:50%;display:flex;align-items:center;justify-content:center">${k}</button>`;
  }).join('');
  return `<div class="screen active" style="background:#f2f2f7;color:#1a1a1a">
    ${statusBar('light')}
    <div class="hdr">
      <button class="back" data-go="welcome" style="color:#00a651"><svg width="12" height="20" viewBox="0 0 12 20" fill="none"><path d="M10 2L2 10l8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Retour</button>
      <h1 style="color:#1a1a1a">Se connecter</h1>
      <div style="width:70px"></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;padding-top:48px">
      <p style="font-size:16px;margin-bottom:36px;text-align:center">Introduisez votre code Easy Banking</p>
      <div class="${state.pinErr?'shake':''}" style="display:flex;gap:20px;margin-bottom:16px">${dots}</div>
      ${state.pinErr?`<p style="color:#ff3b30;font-size:13px;margin-top:8px">Code incorrect. Réessayez.</p>`:`<p style="color:#8e8e93;font-size:13px;margin-top:8px;height:13px"></p>`}
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px 0;padding:0 40px 12px;max-width:360px;width:100%;margin:0 auto">${pad}</div>
    <button style="text-align:center;color:#00a651;font-size:15px;font-weight:500;padding:12px 0 calc(24px + var(--safe-b))">Code oublié ?</button>
  </div>`;
}

                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f3d36" stroke-width="2"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2" stroke-linecap="round"/><rect x="8" y="8" width="8" height="8" rx="1" stroke-width="1.5"/></svg>

                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M12 5v14M8 15l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>Recevoir
            </button>

        </div>

/* ========== RENDER ========== */
function render(){
  const root=document.getElementById('app');
  const map={
    welcome:screenWelcome, pin:screenPin, home:screenHome,
    transfer:screenTransfer, amount:screenAmount, confirm:screenConfirm,
    receive:screenReceive, scanner:screenScanner,
    services:screenServices, contact:screenContact, settings:screenSettings,
  };
  const fn=map[state.screen]||screenWelcome;
  root.innerHTML=fn();
  bind(root);
  // focus inputs
  const si=document.getElementById('searchInp');
  if(si){const v=si.value;si.focus();si.setSelectionRange(v.length,v.length)}
  const ai=document.getElementById('amountInp');
  if(ai && state.screen==='amount'){ai.focus()}
}

function bind(root){
  root.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const name=el.getAttribute('data-go');
      if(el.getAttribute('data-reset')){state.draft=null;state.amountStr='';state.comm='';state.done=false;state.sending=false;state.search=''}
      // auth gate
      const needAuth=['home','transfer','amount','confirm','receive','scanner','services','contact','settings'];
      if(needAuth.includes(name) && !state.auth && name!=='pin'){go('pin');return}
      go(name);
    });
  });
  root.querySelectorAll('[data-pin]').forEach(el=>{
    el.addEventListener('click',()=>{
      const k=el.getAttribute('data-pin');
      if(k==='del'){state.pin=state.pin.slice(0,-1);state.pinErr=false;render();return}
      if(state.pin.length>=5) return;
      state.pinErr=false;
      state.pin+=k;
      render();
      if(state.pin.length===5){
        if(state.pin===PIN_OK){
          state.auth=true;state.pin='';
          setTimeout(()=>go('home'),200);
        } else {
          state.pinErr=true;render();
          setTimeout(()=>{state.pin='';state.pinErr=false;render()},400);
        }
      }
    });
  });
  root.querySelectorAll('[data-ben]').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('[data-fav]')) return;
      const id=+el.getAttribute('data-ben');
      const ben=state.beneficiaries.find(b=>b.id===id);
      state.draft={ben,amount:'',comm:''};
      state.amountStr='';state.comm='';state.done=false;
      go('amount');
    });
  });
  root.querySelectorAll('[data-fav]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const id=+el.getAttribute('data-fav');
      const b=state.beneficiaries.find(x=>x.id===id);
      if(b) b.fav=!b.fav;
      render();
    });
  });
  root.querySelectorAll('[data-qa]').forEach(el=>{
    el.addEventListener('click',()=>{state.amountStr=el.getAttribute('data-qa');render()});
  });
  root.querySelectorAll('[data-act]').forEach(el=>{
    el.addEventListener('click',e=>{
      const act=el.getAttribute('data-act');
      if(act==='clear-search'){state.search='';render()}
      if(act==='new-ben'){alert('Ajoutez un nouveau bénéficiaire')}
      if(act==='to-confirm'){
        const num=parseFloat(String(state.amountStr).replace(',','.'))||0;
        if(num<=0||num>state.user.balance) return;
        state.draft.amount=num.toFixed(2);
        state.draft.comm=state.comm||'';
        go('confirm');
      }
      if(act==='confirm-tx'){
        if(state.sending) return;
        state.sending=true;render();
        setTimeout(()=>{
          const amt=parseFloat(state.draft.amount);
          state.user.balance=Math.round((state.user.balance-amt)*100)/100;
          state.txs.unshift({id:Date.now(),label:state.draft.ben.name,amount:-amt,date:new Date().toISOString().slice(0,10),type:'debit',communication:state.draft.comm});
          state.sending=false;state.done=true;render();
        },900);
      }
      if(act==='copy-iban'){
        const t=state.user.iban.replace(/\s/g,'');
        if(navigator.clipboard) navigator.clipboard.writeText(t).catch(()=>{});
        el.style.opacity='.4';setTimeout(()=>el.style.opacity='1',500);
      }
      if(act==='share'){alert('Coordonnées :\\n'+state.user.fullName+'\\n'+state.user.iban+'\\nBIC: GEBABEBB')}
      if(act==='logout'){state.auth=false;state.pin='';go('welcome')}
    });
  });
  const si=document.getElementById('searchInp');
  if(si){
    si.addEventListener('input',()=>{
      state.search=si.value;
      // re-render but keep focus — simpler: just filter without full re-render of input
      // full re-render is ok
      const pos=si.selectionStart;
      render();
    });
  }
  const ai=document.getElementById('amountInp');
  if(ai){
    ai.addEventListener('input',()=>{
      state.amountStr=ai.value.replace(/[^0-9.,]/g,'');
      render();
    });
  }
  const ci=document.getElementById('commInp');
  if(ci){
    ci.addEventListener('input',()=>{state.comm=ci.value});
    ci.addEventListener('change',()=>{state.comm=ci.value});
  }
}

// keyboard for PIN
window.addEventListener('keydown',e=>{
  if(state.screen!=='pin') return;
  if(e.key>='0'&&e.key<='9'){
    const btn=document.querySelector(`[data-pin="${e.key}"]`);
    if(btn) btn.click();
  }
  if(e.key==='Backspace'){
    const btn=document.querySelector('[data-pin="del"]');
    if(btn) btn.click();
  }
});

render();
</script>
